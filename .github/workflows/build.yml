name: Build WifiRoam NativeAOT

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish NativeAOT
        run: >
          dotnet publish WifiRoam.csproj
          -c Release
          -r win-x64
          -p:PublishAot=true
          -p:SelfContained=true
          -p:InvariantGlobalization=true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WifiRoam-NativeAOT
          path: bin/Release/net10.0-windows/win-x64/publish/
