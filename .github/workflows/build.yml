name: Build WifiRoam

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore WifiRoam.csproj

      - name: Publish NativeAOT
        run: >
          dotnet publish WifiRoam.csproj
          -c Release
          -r win-x64
          -p:PublishAot=true
          -p:SelfContained=true
          -p:InvariantGlobalization=true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WifiRoam
          path: bin/Release/net10.0-windows/win-x64/publish/

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/Release/net10.0-windows/win-x64/publish/WifiRoam.exe
          generate_release_notes: true
          draft: false
          prerelease: false
